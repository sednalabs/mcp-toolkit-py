[build-system]
requires = ["setuptools>=80.10.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-toolkit"
version = "0.0.0"
description = "Shared MCP utilities for Python servers/clients."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sednalabs/mcp-toolkit-py"
Source = "https://github.com/sednalabs/mcp-toolkit-py"
Issues = "https://github.com/sednalabs/mcp-toolkit-py/issues"

[project.optional-dependencies]
security = ["PyJWT[crypto]>=2.10.1", "cryptography>=46.0.3"]
dev = ["pytest>=9.0.0", "ruff>=0.14.13"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
